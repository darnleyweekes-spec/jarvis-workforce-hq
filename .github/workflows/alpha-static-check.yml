name: ALPHA static checks

on:
  push:
    branches: [main, alpha-mission-control]
    paths:
      - index.html
      - styles.css
      - script.js
      - README.md
      - ALPHA_ARCHITECTURE.md
      - alpha-runtime/**
      - .dockerignore
      - project-kit/**
      - brand/project-brand-registry.json
      - .github/workflows/alpha-static-check.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - script.js
      - README.md
      - ALPHA_ARCHITECTURE.md
      - alpha-runtime/**
      - project-kit/**
      - brand/project-brand-registry.json
      - .github/workflows/alpha-static-check.yml

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check Compute Engine deployment script syntax
        run: bash -n alpha-runtime/deploy_gce.sh
      - name: Test ALPHA runtime core
        run: python3 -m unittest discover -s alpha-runtime -p 'test_*.py' -v
      - name: Build ALPHA deployable container
        run: docker build -f alpha-runtime/Dockerfile -t alpha-api:ci .
      - name: Smoke test container startup and authentication
        run: |
          docker run -d --name alpha-api-ci -e ALPHA_API_TOKEN=ci-token-with-more-than-thirty-two-characters -p 127.0.0.1:18080:8080 alpha-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/readyz)" = "401"
          curl -fsS -H "Authorization: Bearer ci-token-with-more-than-thirty-two-characters" http://127.0.0.1:18080/readyz
          curl -fsS -X POST http://127.0.0.1:18080/v1/missions \
            -H "Authorization: Bearer ci-token-with-more-than-thirty-two-characters" \
            -H "Content-Type: application/json" \
            -d '{"mission_id":"ci-smoke","objective":"Check metadata","owner_scope":"prime24ai","project_scope":"agents","evidence":[{"evidence_id":"ev-ci","claim":"Operator reported a test incident","source":"ci","retrieved_at":"2026-10-09T10:00:00Z","classification":"user_input"}]}'
          curl -fsS -H "Authorization: Bearer ci-token-with-more-than-thirty-two-characters" http://127.0.0.1:18080/v1/missions/ci-smoke/evaluation | python3 -c 'import json,sys; assert json.load(sys.stdin)["terminal_success"]'
          docker stop alpha-api-ci
      - name: Check project contracts and new-idea gate
        run: |
          python3 project-kit/project_contract.py check project-kit/projects.json
          python3 -m unittest discover -s project-kit -p 'test_*.py' -v
      - name: Check ALPHA Mission Lab contract
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text()
          js = Path('script.js').read_text()
          readme = Path('README.md').read_text()

          required_ids = ['mission-form', 'mission-text', 'mission-result', 'char-count']
          missing = [item for item in required_ids if f'id="{item}"' not in html]
          if missing:
              raise SystemExit(f'Missing Mission Lab DOM ids: {missing}')

          if 'ALPHA' not in html or 'ALPHA' not in js or 'ALPHA' not in readme:
              raise SystemExit('ALPHA branding missing from a core file')

          for path, content in [('index.html', html), ('script.js', js), ('README.md', readme)]:
              if 'JARVIS' in content.upper():
                  raise SystemExit(f'Legacy JARVIS branding remains in {path}')

          print('ALPHA Mission Lab static contract passed')
          PY
