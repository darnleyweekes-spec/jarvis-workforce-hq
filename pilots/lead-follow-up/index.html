<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Follow-up Pilot · ALPHA</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#e9eef7;background:#101a2b}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:24px}h1,h2{line-height:1.2}h1{margin:0;font-size:2rem}.muted{color:#aebdd0}header{border-bottom:1px solid #34435a;padding-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;margin-top:24px}.card{background:#19283d;border:1px solid #34435a;border-radius:12px;padding:20px}label{display:block;margin:12px 0 4px;font-weight:600}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:10px;background:#101a2b;color:#fff;border:1px solid #65758d;border-radius:6px}textarea{min-height:90px}button{background:#52bba7;border:0;border-radius:6px;color:#061c1b;padding:9px 14px;font-weight:700;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#344962;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.lead{border-top:1px solid #34435a;padding:15px 0}.lead:first-child{border:0}.lead p{margin:6px 0;white-space:pre-wrap}.notice{background:#274054;padding:10px;border-radius:6px}small{color:#aebdd0}.badge{display:inline-block;background:#344962;border-radius:20px;padding:2px 9px;font-size:.85rem}#message{min-height:24px}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:16px}}
</style></head><body><main><header><h1>Lead follow-up pilot</h1><p class="muted">ALPHA demonstration · a person reviews and sends every response</p><p class="notice">This workspace saves entries in this browser only. Use fictional inquiries for the demo. It has no email, CRM, authentication, or shared storage connection.</p></header>
<div class="grid"><section class="card"><h2>Record an inquiry</h2><form id="form"><label for="name">Contact name</label><input id="name" required maxlength="100"><label for="email">Email</label><input id="email" type="email" required maxlength="254"><label for="source">Source</label><select id="source"><option>Website form</option><option>Email</option><option>Referral</option><option>Other</option></select><label for="inquiry">What they asked</label><textarea id="inquiry" required maxlength="2000"></textarea><button>Add inquiry</button></form><p id="message" role="status"></p><button class="secondary" id="sample" type="button">Load fictional example</button><button class="secondary" id="export" type="button">Export CSV</button><button class="secondary" id="clear" type="button">Clear browser data</button></section><section class="card"><h2>Review queue</h2><p class="muted" id="metrics"></p><div id="queue"></div></section></div></main>
<script>
const KEY='alpha-lead-pilot-v1';let leads=[];try{leads=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(leads))leads=[]}catch{leads=[]}const $=id=>document.getElementById(id);const save=()=>{localStorage.setItem(KEY,JSON.stringify(leads));render()};const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draft(l){const first=l.name.trim().split(/\s+/)[0];return `Hi ${first},\n\nThanks for contacting us about ${l.inquiry.trim().replace(/[.!?]+$/,'').slice(0,120)}. I can help with the next step. Could you share your preferred timing and any details we should know before we respond?\n\nBest,\n[Your name]`}
function add(name,email,source,inquiry){const normalized=email.trim().toLowerCase();if(leads.some(l=>l.email===normalized&&l.inquiry.trim().toLowerCase()===inquiry.trim().toLowerCase())){$('message').textContent='Duplicate inquiry: this email and request are already in the queue.';return}leads.unshift({id:crypto.randomUUID(),name:name.trim(),email:normalized,source,inquiry:inquiry.trim(),created:new Date().toISOString(),status:'New',draft:''});$('message').textContent='Inquiry recorded. Review the draft before sending anything.';save()}
$('form').addEventListener('submit',e=>{e.preventDefault();add($('name').value,$('email').value,$('source').value,$('inquiry').value);if($('message').textContent.startsWith('Inquiry recorded'))e.target.reset()});$('sample').onclick=()=>add('Jordan Example','jordan@example.invalid','Website form','a quote for weekly office cleaning');
function render(){const counts=Object.fromEntries(['New','Drafted','Approved','Sent manually','Replied','Booked','Closed'].map(x=>[x,leads.filter(l=>l.status===x).length]));$('metrics').textContent=`${leads.length} inquiries · ${counts.New} new · ${counts.Drafted} drafts awaiting review · ${counts.Booked} booked`;$('queue').innerHTML=leads.length?'':`<p class="muted">No inquiries yet. Load the fictional example to try the flow.</p>`;for(const l of leads){const box=document.createElement('article');box.className='lead';box.innerHTML=`<strong>${safe(l.name)}</strong> <span class="badge">${safe(l.status)}</span><p><small>${safe(l.email)} · ${safe(l.source)} · ${safe(new Date(l.created).toLocaleString())}</small></p><p>${safe(l.inquiry)}</p><label>Response draft — edit before approval</label><textarea aria-label="Draft for ${safe(l.name)}">${safe(l.draft)}</textarea><div><button data-action="generate">Prepare draft</button><button data-action="approve" class="secondary">Approve draft</button><button data-action="copy" class="secondary">Copy approved draft</button></div><label>Outcome</label><select aria-label="Outcome for ${safe(l.name)}">${['New','Drafted','Approved','Sent manually','Replied','Booked','Closed'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select>`;const area=box.querySelector('textarea');box.querySelector('[data-action=generate]').onclick=()=>{l.draft=draft(l);l.status='Drafted';save()};box.querySelector('[data-action=approve]').onclick=()=>{if(!area.value.trim())return alert('Write and review a draft first.');l.draft=area.value;l.status='Approved';save()};box.querySelector('[data-action=copy]').onclick=async()=>{if(l.status!=='Approved'&&l.status!=='Sent manually')return alert('Approve this exact draft first.');if(area.value!==l.draft)return alert('Draft changed after approval. Approve it again.');await navigator.clipboard.writeText(l.draft);$('message').textContent='Approved draft copied. Send manually in your email app.'};area.onchange=()=>{if(area.value!==l.draft&&l.status==='Approved'){l.status='Drafted';save()}};box.querySelector('select').onchange=e=>{if(e.target.value==='Approved')return alert('Use Approve draft to approve the exact text.');if(['Sent manually','Replied','Booked'].includes(e.target.value)&&!['Approved','Sent manually','Replied','Booked'].includes(l.status))return alert('Approve the draft before recording a send or response.');l.status=e.target.value;save()};$('queue').append(box)}}
$('export').onclick=()=>{const fields=['created','name','email','source','inquiry','status','draft'];const csv=[fields.join(','),...leads.map(l=>fields.map(f=>'"'+String(l[f]||'').replaceAll('"','""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='lead-follow-up-pilot.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('clear').onclick=()=>{if(confirm('Delete all inquiries in this browser?')){leads=[];save()}};render();
</script></body></html>
